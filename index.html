<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chat</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#0f1117; color:#e6e6e6;
         display:flex; flex-direction:column; height:100dvh; }
  header { padding:14px 18px; font-weight:600; border-bottom:1px solid #222; display:flex; justify-content:space-between; align-items:center; }
  header button { background:none; border:1px solid #333; color:#aaa; border-radius:8px; padding:4px 10px; cursor:pointer; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg-wrap { max-width:85%; display:flex; flex-direction:column; gap:4px; }
  .msg-wrap.user { align-self:flex-end; align-items:flex-end; }
  .msg-wrap.bot { align-self:flex-start; align-items:flex-start; }
  .msg { padding:10px 14px; border-radius:14px; line-height:1.5; word-wrap:break-word; }
  .msg > *:first-child { margin-top:0; }
  .msg > *:last-child { margin-bottom:0; }
  .msg p { margin:8px 0; }
  .msg ul, .msg ol { margin:8px 0; padding-left:22px; }
  .msg li { margin:2px 0; }
  .msg h1, .msg h2, .msg h3 { margin:10px 0 6px; line-height:1.3; }
  .msg h1 { font-size:1.25em; }
  .msg h2 { font-size:1.15em; }
  .msg h3 { font-size:1.05em; }
  .msg code { background:rgba(255,255,255,.12); padding:1px 5px; border-radius:5px; font-size:.9em; }
  .msg pre { background:rgba(0,0,0,.35); padding:10px 12px; border-radius:8px; overflow-x:auto; margin:8px 0; }
  .msg pre code { background:none; padding:0; }
  .user .msg { background:#4f46e5; color:#fff; }
  .bot .msg { background:#1c1f2b; }
  .copy-btn { background:none; border:none; color:#777; font-size:12px; cursor:pointer; padding:2px 6px; border-radius:6px; display:flex; align-items:center; gap:4px; }
  .copy-btn:hover { color:#ccc; background:rgba(255,255,255,.08); }
  .copy-btn svg { width:13px; height:13px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid #222; }
  input { flex:1; padding:12px 14px; border-radius:12px; border:1px solid #333; background:#161925; color:#fff; font-size:16px; }
  form button { padding:0 18px; border:none; border-radius:12px; background:#4f46e5; color:#fff; font-size:16px; cursor:pointer; }
  form button:disabled { opacity:.5; }
</style>
</head>
<body>
  <header><span>AI Chat</span><button id="clear">Clear</button></header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="Type a message..." autocomplete="off" required>
    <button id="send">Send</button>
  </form>
<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let history = [];

  try { history = JSON.parse(localStorage.getItem("chat_history")) || []; } catch (e) {}

  function save() { try { localStorage.setItem("chat_history", JSON.stringify(history)); } catch (e) {} }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Minimal markdown renderer: headers, bold/italic, inline code, code blocks, lists, paragraphs.
  function renderMarkdown(raw) {
    const codeBlocks = [];
    let text = raw.replace(/```([\s\S]*?)```/g, (_, code) => {
      codeBlocks.push(code.replace(/^\n/, "").replace(/\n$/, ""));
      return "\u0000CODEBLOCK" + (codeBlocks.length - 1) + "\u0000";
    });

    text = escapeHtml(text);
    text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
    text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");

    const lines = text.split("\n");
    const out = [];
    let listType = null; // 'ul' | 'ol' | null
    let para = [];

    function flushPara() {
      if (para.length) { out.push("<p>" + para.join("<br>") + "</p>"); para = []; }
    }
    function closeList() {
      if (listType) { out.push("</" + listType + ">"); listType = null; }
    }

    for (const line of lines) {
      const h = line.match(/^(#{1,3})\s+(.*)/);
      const ol = line.match(/^\s*\d+[.)]\s+(.*)/);
      const ul = line.match(/^\s*[-*]\s+(.*)/);

      if (h) {
        flushPara(); closeList();
        out.push(`<h${h[1].length}>${h[2]}</h${h[1].length}>`);
      } else if (ol) {
        flushPara();
        if (listType !== "ol") { closeList(); out.push("<ol>"); listType = "ol"; }
        out.push("<li>" + ol[1] + "</li>");
      } else if (ul) {
        flushPara();
        if (listType !== "ul") { closeList(); out.push("<ul>"); listType = "ul"; }
        out.push("<li>" + ul[1] + "</li>");
      } else if (line.trim() === "") {
        flushPara(); closeList();
      } else {
        closeList();
        para.push(line);
      }
    }
    flushPara(); closeList();

    let html = out.join("");
    html = html.replace(/\u0000CODEBLOCK(\d+)\u0000/g, (_, i) =>
      "<pre><code>" + escapeHtml(codeBlocks[+i]) + "</code></pre>"
    );
    return html || escapeHtml(raw);
  }

  function copyIcon() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
  }

  function add(text, cls) {
    const wrap = document.createElement("div");
    wrap.className = "msg-wrap " + cls;

    const bubble = document.createElement("div");
    bubble.className = "msg";
    bubble.innerHTML = cls === "bot" ? renderMarkdown(text) : escapeHtml(text).replace(/\n/g, "<br>");
    wrap.appendChild(bubble);

    const copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "copy-btn";
    copyBtn.innerHTML = copyIcon() + "<span>Copy</span>";
    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(wrap.dataset.raw ?? "");
        copyBtn.innerHTML = copyIcon() + "<span>Copied</span>";
        setTimeout(() => { copyBtn.innerHTML = copyIcon() + "<span>Copy</span>"; }, 1500);
      } catch (e) {}
    };
    wrap.appendChild(copyBtn);
    wrap.dataset.raw = text;

    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return { wrap, bubble, copyBtn };
  }

  history.forEach(m => add(m.content, m.role === "user" ? "user" : "bot"));

  document.getElementById("clear").onclick = () => { history = []; chat.innerHTML = ""; save(); };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    add(text, "user");
    history.push({ role: "user", content: text });
    send.disabled = true;
    const { wrap, bubble } = add("Thinking...", "bot");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      bubble.innerHTML = renderMarkdown(data.reply);
      wrap.dataset.raw = data.reply;
      history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      bubble.textContent = "Error: " + err.message;
      wrap.dataset.raw = "Error: " + err.message;
      history.pop();
    }
    save();
    send.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
