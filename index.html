<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chat</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#0f1117; color:#e6e6e6;
         display:flex; flex-direction:column; height:100dvh; }
  header { padding:14px 18px; font-weight:600; border-bottom:1px solid #222; display:flex; justify-content:space-between; align-items:center; }
  header button { background:none; border:1px solid #333; color:#aaa; border-radius:8px; padding:4px 10px; cursor:pointer; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:#4f46e5; color:#fff; }
  .bot { align-self:flex-start; background:#1c1f2b; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid #222; }
  input { flex:1; padding:12px 14px; border-radius:12px; border:1px solid #333; background:#161925; color:#fff; font-size:16px; }
  form button { padding:0 18px; border:none; border-radius:12px; background:#4f46e5; color:#fff; font-size:16px; cursor:pointer; }
  form button:disabled { opacity:.5; }
</style>
</head>
<body>
  <header><span>AI Chat</span><button id="clear">Clear</button></header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="Type a message..." autocomplete="off" required>
    <button id="send">Send</button>
  </form>
<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let history = [];

  try { history = JSON.parse(localStorage.getItem("chat_history")) || []; } catch (e) {}

  function save() { try { localStorage.setItem("chat_history", JSON.stringify(history)); } catch (e) {} }

  function add(text, cls) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  history.forEach(m => add(m.content, m.role === "user" ? "user" : "bot"));

  document.getElementById("clear").onclick = () => { history = []; chat.innerHTML = ""; save(); };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    add(text, "user");
    history.push({ role: "user", content: text });
    send.disabled = true;
    const bubble = add("Thinking...", "bot");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      bubble.textContent = data.reply;
      history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      bubble.textContent = "Error: " + err.message;
      history.pop();
    }
    save();
    send.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
